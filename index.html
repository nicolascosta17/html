<!DOCTYPE html>
<html>
    <head>
        <title>Documento</title>
        <style>
            /*Adicionar CSS*/
            .centralizar{
                text-align: center;
            }
            .texto-verde{
                color: green;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: large;
            }
            .texto-roxo{
                color: violet;
                font-style: italic;
                font-size: large;
            }
            .texto-branco{
                color: white;
            }
            .bordas{
                border: solid 1px rgb(248, 7, 7);
                background-color: black;
            }
            .btn{
                background-color: #077e52;/*Verde*/
                width: 20%; height: 50px;
            }
            .btn2{
                background-color: red;
                width: 20%; height: 50px;
            }
            .centralizar-borda{
                border-color: black;
            }

        </style>
        <body>
            <h1 class="centralizar">Bem-vindo é o HTML!</h1>
            <hr>
            <p class="texto-verde">Este texto é verde Segoe UI </p>
            <p class="texto-roxo">Este texto é roxo italic </p>
            <div class="centralizar">
                <h2>Seção centralizada</h2>
                <p>Aqui estamos centralizando todo o conteúdo deste div.</p>
                <img src="html.png"/>
                <br>
                <button class="btn">Sim</button>
                <button class="btn2">Não</button>
            </div>
            <br>
            <hr>
            <div class="centralizada-borda">
                <p class="texto-branco">Este é um texto em branco</p>
            </div>
         </body>
    </head>
</html>
